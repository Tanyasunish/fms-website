name: Deploy Preview

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-preview-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy PR build to Vercel Preview
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Vercel (Preview)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          output="$(npx vercel deploy dist --yes 2>&1)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s\n' "$output" | grep -oE 'https://[a-zA-Z0-9-]+\.vercel\.app' | head -n 1 || true)"
          if [ -n "$preview_url" ]; then
            echo "### Vercel Preview Deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "$preview_url" >> "$GITHUB_STEP_SUMMARY"
          fi
